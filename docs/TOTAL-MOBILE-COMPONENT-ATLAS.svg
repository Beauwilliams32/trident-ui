<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#071222"/><stop offset="1" stop-color="#10243b"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#183b55" stop-opacity=".92"/><stop offset="1" stop-color="#0c2032" stop-opacity=".96"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020812" flood-opacity=".32"/></filter>
    <style>
      .ui{font-family:Inter,Arial,sans-serif}.eyebrow{font:600 12px Inter,Arial,sans-serif;letter-spacing:2px}.title{font:600 34px Inter,Arial,sans-serif;letter-spacing:-.7px}.h{font:600 18px Inter,Arial,sans-serif}.body{font:400 14px Inter,Arial,sans-serif}.small{font:500 11px Inter,Arial,sans-serif;letter-spacing:.25px}.mono{font:500 11px ui-monospace,Menlo,monospace}
    </style>
  </defs>
  <rect width="1600" height="1080" fill="url(#canvas)"/>
  <circle cx="1390" cy="50" r="260" fill="#27c8bc" opacity=".06"/>
  <circle cx="120" cy="1040" r="240" fill="#6a70e8" opacity=".08"/>
  <g class="ui" fill="#f2f5f9">
    <text x="72" y="58" class="eyebrow" fill="#6fe2d4">WILLIAMS MEDIA  /  MOBILE SYSTEM  /  REVIEW SHEET</text>
    <text x="72" y="112" class="title">One shared rhythm. Distinct product voices.</text>
    <text x="72" y="145" class="body" fill="#aebdca">Shared touch, spacing, focus and feedback behavior sits beneath each product’s own brand layer.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="72" y="184" width="1456" height="150" rx="24" fill="url(#glass)" stroke="#31526b"/>
    <rect x="92" y="204" width="207" height="110" rx="15" fill="#f7f5f1"/>
    <rect x="315" y="204" width="207" height="110" rx="15" fill="#06090d" stroke="#454c55"/>
    <rect x="538" y="204" width="207" height="110" rx="15" fill="#0d1b29" stroke="#267f91"/>
    <rect x="761" y="204" width="207" height="110" rx="15" fill="#f1f6ff"/>
    <rect x="984" y="204" width="207" height="110" rx="15" fill="#101a32" stroke="#7685c9"/>
    <rect x="1207" y="204" width="297" height="110" rx="15" fill="#171b22" stroke="#747b85"/>
  </g>
  <g class="ui">
    <text x="112" y="230" class="eyebrow" fill="#7250c9">PORTAL</text><text x="112" y="260" class="h" fill="#211943">Calm, paper-light</text><text x="112" y="286" class="small" fill="#5a5668">Manrope · violet / blue</text>
    <text x="335" y="230" class="eyebrow" fill="#d4d8de">POSEIDON</text><text x="335" y="260" class="h" fill="#fff">Image-led, precise</text><text x="335" y="286" class="small" fill="#a2a8b1">Monochrome · photography</text>
    <text x="558" y="230" class="eyebrow" fill="#66e6dc">TRIDENT</text><text x="558" y="260" class="h" fill="#eef9fd">Utility, glass</text><text x="558" y="286" class="small" fill="#9eb5c5">Navy · teal / sky</text>
    <text x="781" y="230" class="eyebrow" fill="#4777bd">LEARNIFY</text><text x="781" y="260" class="h" fill="#14243d">Warm, focused</text><text x="781" y="286" class="small" fill="#52637a">Product-owned theme</text>
    <text x="1004" y="230" class="eyebrow" fill="#c8d3ff">GAMES</text><text x="1004" y="260" class="h" fill="#f2f4ff">World-specific art</text><text x="1004" y="286" class="small" fill="#aeb4d0">48px action target</text>
    <text x="1227" y="230" class="eyebrow" fill="#dadde4">NATIVE APPS</text><text x="1227" y="260" class="h" fill="#f4f4f5">Platform-first</text><text x="1227" y="286" class="small" fill="#aeb2ba">Safe areas · native sheets</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="72" y="366" width="700" height="372" rx="24" fill="#f8f7f4"/>
    <rect x="800" y="366" width="728" height="372" rx="24" fill="url(#glass)" stroke="#31526b"/>
  </g>
  <g class="ui">
    <text x="104" y="408" class="eyebrow" fill="#7053c8">SHARED COMPONENT BEHAVIOR</text>
    <text x="104" y="443" class="h" fill="#1b2030">Touch actions · navigation · form</text>
    <rect x="104" y="468" width="202" height="52" rx="13" fill="#6448c7"/><text x="126" y="500" class="body" fill="#fff">Primary action</text><text x="324" y="500" class="small" fill="#656977">44px minimum · visible focus ring</text>
    <rect x="104" y="538" width="202" height="56" rx="14" fill="#111926"/><text x="126" y="572" class="body" fill="#f4f6f8">Game action</text><text x="324" y="572" class="small" fill="#656977">48px target · press feedback</text>
    <rect x="104" y="612" width="420" height="58" rx="12" fill="#fff" stroke="#aeb1bc"/><text x="124" y="636" class="small" fill="#737887">EVENT CODE</text><text x="124" y="657" class="body" fill="#252a35">Enter your code</text><rect x="538" y="612" width="202" height="58" rx="12" fill="#eceaf4"/><text x="556" y="636" class="small" fill="#625789">FORM FIELD</text><text x="556" y="657" class="small" fill="#474357">Label + hint + error</text>
    <rect x="104" y="689" width="636" height="1" fill="#e5e3df"/><text x="104" y="714" class="small" fill="#666975">4px spacing · 160/240/320ms motion · reduced-motion safe</text>
    <text x="832" y="408" class="eyebrow" fill="#6fe2d4">BRAND-SPECIFIC SURFACES</text>
    <text x="832" y="443" class="h" fill="#f2f5f9">Same semantics, authored per product</text>
    <rect x="832" y="468" width="314" height="220" rx="18" fill="#11263a" stroke="#38647b"/>
    <text x="856" y="500" class="eyebrow" fill="#64e4d9">TRIDENT GLASS CARD</text><text x="856" y="536" class="h" fill="#f2f8fb">Studio activity</text><text x="856" y="565" class="body" fill="#b2c6d2">Clear hierarchy and statuses</text><rect x="856" y="596" width="266" height="1" fill="#2c5065"/><circle cx="866" cy="630" r="5" fill="#5dd5be"/><text x="882" y="634" class="small" fill="#d2e1e8">Ready · accessible announcement</text><text x="856" y="668" class="mono" fill="#8fb0bf">status.surface / status.text</text>
    <rect x="1164" y="468" width="332" height="220" rx="18" fill="#07090c" stroke="#4b525c"/>
    <text x="1188" y="500" class="eyebrow" fill="#e0e2e6">POSEIDON GALLERY CARD</text><rect x="1188" y="518" width="284" height="94" rx="11" fill="#22272f"/><path d="M1200 594l48-49 39 33 29-23 43 43h-159z" fill="#4a5662"/><circle cx="1427" cy="542" r="11" fill="#9ab2be"/><text x="1188" y="640" class="h" fill="#fff">Event moments</text><text x="1188" y="665" class="small" fill="#b6bdc6">Real imagery · consent · order clarity</text>
  </g>
  <g class="ui">
    <rect x="72" y="770" width="1456" height="230" rx="24" fill="#0b1928" stroke="#28445a"/>
    <text x="104" y="812" class="eyebrow" fill="#6fe2d4">COMPONENT STATES AND SAFEGUARDS</text>
    <text x="104" y="849" class="h" fill="#eff4f7">Design for the whole flow</text>
    <g font-family="Inter,Arial,sans-serif">
      <rect x="104" y="873" width="318" height="82" rx="14" fill="#13263a" stroke="#2f526b"/><circle cx="128" cy="902" r="8" fill="#6fe2d4"/><text x="148" y="906" class="body" fill="#f5f7fa">Success / saved</text><text x="124" y="935" class="small" fill="#adbfcb">Visible message + live announcement</text>
      <rect x="440" y="873" width="318" height="82" rx="14" fill="#2a1d25" stroke="#68414a"/><circle cx="464" cy="902" r="8" fill="#fa8b84"/><text x="484" y="906" class="body" fill="#fff3f0">Error / recovery</text><text x="460" y="935" class="small" fill="#d3b5b7">Explain, preserve input, offer next step</text>
      <rect x="776" y="873" width="318" height="82" rx="14" fill="#13263a" stroke="#2f526b"/><rect x="800" y="891" width="22" height="22" rx="6" fill="none" stroke="#a3c2d3"/><text x="838" y="906" class="body" fill="#f5f7fa">Empty / loading</text><text x="796" y="935" class="small" fill="#adbfcb">Useful guidance, stable layout</text>
      <rect x="1112" y="873" width="384" height="82" rx="14" fill="#13263a" stroke="#2f526b"/><path d="M1135 902h28" stroke="#75b5e2" stroke-width="2"/><text x="1176" y="906" class="body" fill="#f5f7fa">Media / motion</text><text x="1132" y="935" class="small" fill="#adbfcb">Pause offscreen · honor data saver / reduce motion</text>
    </g>
    <text x="104" y="980" class="small" fill="#a3b6c3">Review sheet imported as editable SVG vectors. Native Figma variables, component sets and interactive prototypes require an enabled Figma edit seat.</text>
  </g>
</svg>
